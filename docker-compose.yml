version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tender_postgres
    environment:
      POSTGRES_DB: tender
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Jafarbek123000566j}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5400:5432"
    networks:
      - tender_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tender_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tender_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: ./backend_py
      dockerfile: Dockerfile
    container_name: tender_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-Jafarbek123000566j}@postgres:5432/tender
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_SHEETS_SPREADSHEET_NAME: ${GOOGLE_SHEETS_SPREADSHEET_NAME:-Tender Intelligence Platform}
      GOOGLE_SHEETS_SHARE_EMAIL: ${GOOGLE_SHEETS_SHARE_EMAIL}
      SCRAPE_EVERY_MINUTES: ${SCRAPE_EVERY_MINUTES:-15}
      SCRAPE_HOUR: ${SCRAPE_HOUR:-9}
      SCRAPE_MINUTE: ${SCRAPE_MINUTE:-0}
      TELEGRAM_MONITOR_ENABLED: ${TELEGRAM_MONITOR_ENABLED:-false}
      GOOGLE_SHEETS_AUTO_EXPORT: ${GOOGLE_SHEETS_AUTO_EXPORT:-true}
      TELEGRAM_BOT_POLLING: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - tender_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  celery_worker:
    build:
      context: ./backend_py
      dockerfile: Dockerfile
    container_name: tender_celery_worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-Jafarbek123000566j}@postgres:5432/tender
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_SHEETS_SPREADSHEET_NAME: ${GOOGLE_SHEETS_SPREADSHEET_NAME:-Tender Intelligence Platform}
      GOOGLE_SHEETS_SHARE_EMAIL: ${GOOGLE_SHEETS_SHARE_EMAIL}
      SCRAPE_EVERY_MINUTES: ${SCRAPE_EVERY_MINUTES:-15}
      SCRAPE_HOUR: ${SCRAPE_HOUR:-9}
      SCRAPE_MINUTE: ${SCRAPE_MINUTE:-0}
      TELEGRAM_MONITOR_ENABLED: ${TELEGRAM_MONITOR_ENABLED:-false}
      GOOGLE_SHEETS_AUTO_EXPORT: ${GOOGLE_SHEETS_AUTO_EXPORT:-true}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - tender_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend_py
      dockerfile: Dockerfile
    container_name: tender_celery_beat
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-Jafarbek123000566j}@postgres:5432/tender
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_SHEETS_SPREADSHEET_NAME: ${GOOGLE_SHEETS_SPREADSHEET_NAME:-Tender Intelligence Platform}
      GOOGLE_SHEETS_SHARE_EMAIL: ${GOOGLE_SHEETS_SHARE_EMAIL}
      SCRAPE_EVERY_MINUTES: ${SCRAPE_EVERY_MINUTES:-15}
      SCRAPE_HOUR: ${SCRAPE_HOUR:-9}
      SCRAPE_MINUTE: ${SCRAPE_MINUTE:-0}
      TELEGRAM_MONITOR_ENABLED: ${TELEGRAM_MONITOR_ENABLED:-false}
      GOOGLE_SHEETS_AUTO_EXPORT: ${GOOGLE_SHEETS_AUTO_EXPORT:-true}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - tender_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info


  # Telegram Bot
  bot:
    build:
      context: ./backend_py
      dockerfile: Dockerfile
    container_name: tender_bot
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-Jafarbek123000566j}@postgres:5432/tender
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_SHEETS_SPREADSHEET_NAME: ${GOOGLE_SHEETS_SPREADSHEET_NAME:-Tender Intelligence Platform}
      GOOGLE_SHEETS_SHARE_EMAIL: ${GOOGLE_SHEETS_SHARE_EMAIL}
      SCRAPE_EVERY_MINUTES: ${SCRAPE_EVERY_MINUTES:-15}
      SCRAPE_HOUR: ${SCRAPE_HOUR:-9}
      SCRAPE_MINUTE: ${SCRAPE_MINUTE:-0}
      TELEGRAM_MONITOR_ENABLED: ${TELEGRAM_MONITOR_ENABLED:-false}
      GOOGLE_SHEETS_AUTO_EXPORT: ${GOOGLE_SHEETS_AUTO_EXPORT:-true}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - tender_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: python -m app.bot.bot

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: tender_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - tender_network
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tender_network:
    driver: bridge
